# EV Knowledge Taxonomy — źródło prawdy (canonical).
# Opis zasad: taxonomy/TAXONOMY.md · Widok drzewa generowany: taxonomy/TAXONOMY-TREE.md
# Regeneracja widoku: python3 tools/render_taxonomy.py
#
# Konwencje:
#   id        — stały identyfikator (Dnn / Dnn.mm); nigdy nie jest używany ponownie
#   key       — nazwa katalogu w knowledge/<domain.key>/<subdomain.key>/
#   priority  — mvp (Etap 1) | p2 (Etap 4) | p3 (później / na żądanie)
#   verify    — true = status wersji/numeru normy wymaga potwierdzenia w źródle pierwotnym (Etap 0.6)

taxonomy:
  id: ev-intelligence-taxonomy
  version: 1.3.0
  status: accepted
  accepted: 2026-11-07
  date: 2026-11-27
  language: pl

facets:
  actor:
    description: Kogo dotyczy wiedza (perspektywa roli).
    values: [cpo, emsp, hub, cpms-vendor, evse-manufacturer, ev-oem, dso, tso, energy-supplier,
             aggregator, site-host, fleet-operator, driver, installer, field-technician,
             noc-operator, customer-support, payment-provider, regulator, investor]
  lifecycle:
    description: Etap cyklu życia infrastruktury lub produktu.
    values: [plan, design, procure, deploy, commission, operate, maintain, settle, decommission]
  layer:
    description: Warstwa techniczna.
    values: [physical-electrical, vehicle, device, field-communication, backend, inter-system, business, regulatory]
  knowledge_type:
    description: Rodzaj wiedzy (zgodnie z EV Knowledge Standard).
    values: [normative, vendor, expert, implementation, product]
  source_class:
    description: Klasa źródła.
    values: [A, B, C, D]
  confidence:
    values: [official, verified, observed, hypothesis]
  region:
    description: Zasięg geograficzny / jurysdykcja.
    values: [global, eu, pl, de, nl, fr, be, at, it, es, nordics, uk, ch, us, other]
  segment:
    description: Kontekst ładowania — patrz domena D19.
    values: [public-ac, public-dc, hpc-corridor, destination, workplace, residential, multi-family,
             fleet-depot, heavy-duty, bus, lev, wireless, battery-swap, mobile]

relation_types:
  depends_on: Domena/temat wymaga wiedzy z innego obszaru, by być zrozumiałym.
  maps_to: Obiekt lub komunikat odpowiada obiektowi w innym protokole/modelu.
  constrains: Regulacja lub norma nakłada wymagania na inny obszar.
  implements: Urządzenie/system realizuje funkcję standardu.
  affects: Zmiana w jednym obszarze ma konsekwencje w drugim.
  supersedes: Nowsza wersja zastępuje starszą.

# Rejestr skilli, do których odwołują się domeny (szczegóły: standards/SKILLS-ARCHITECTURE.md — Etap 0.3)
skills:
  ev-domain-expert: {name: EV Domain Expert, role: router, stage: mvp}
  ev-ocpp-expert: {name: OCPP Expert, stage: mvp}
  ev-ocpi-roaming-expert: {name: OCPI / Roaming Expert, stage: mvp}
  ev-cpms-architect: {name: CPMS Architect, stage: mvp}
  ev-evse-hardware-expert: {name: EVSE Hardware Expert, stage: mvp}
  ev-evse-diagnostics-expert: {name: EVSE Diagnostics Expert, stage: mvp}
  ev-charging-operations-expert: {name: Charging Operations Expert, stage: mvp}
  ev-integration-architect: {name: EV Integration Architect, stage: p2}
  ev-billing-tariff-expert: {name: EV Billing & Tariff Expert, stage: p2}
  ev-energy-smart-charging-expert: {name: Energy & Smart Charging Expert, stage: p2}
  ev-iso15118-pki-expert: {name: ISO 15118 & PKI Expert, stage: p2}
  ev-compliance-expert: {name: Compliance Expert, stage: p2}
  ev-product-designer: {name: EV Product Designer, stage: p2}

domains:

  # ───────────────────────────── Fundamenty ─────────────────────────────
  - id: D00
    key: foundations
    name: Fundamenty, terminologia i model domenowy
    name_en: Foundations, terminology & domain model
    description: Wspólny język i model, do którego mapowane są wszystkie protokoły i systemy.
    priority: mvp
    cross_cutting: true
    skills: [ev-domain-expert]
    subdomains:
      - id: D00.01
        key: glossary
        name: Słownik terminologii
        priority: mvp
        topics:
          - Definicje pojęć i ich synonimy (Charge Point / Station / EVSE / Connector / Outlet)
          - Różnice znaczeń tego samego terminu między OCPP, OCPI, OICP, ISO 15118 i IEC
          - Terminologia PL ↔ EN, nazwy stosowane w przepisach krajowych
          - Pojęcia mylone (offline vs unavailable vs faulted, session vs transaction, tariff vs price)
      - id: D00.02
        key: canonical-model
        name: Kanoniczny model domenowy
        priority: mvp
        topics:
          - Hierarchia fizyczna (Site/Location → Station/ChargePoint → EVSE → Connector)
          - Encje transakcyjne (Token, Authorization, Session, Transaction, MeterValue, CDR)
          - Encje handlowe (Tariff, PriceComponent, Contract, Party, Agreement)
          - Encje operacyjne (Alarm, Incident, WorkOrder, MaintenanceWindow, Firmware)
          - Encje energetyczne (ChargingProfile, PowerLimit, Schedule, GridConnection)
          - Mapowanie modelu kanonicznego na OCPP, OCPI, OICP i model wewnętrzny CPMS
      - id: D00.03
        key: actors-roles
        name: Aktorzy i role rynkowe
        priority: mvp
        topics:
          - CPO, eMSP/MSP, hub, CSMS/CPMS vendor, site host, charge point owner
          - Role energetyczne (DSO, TSO, sprzedawca, agregator, BRP)
          - Role łączone (CPO+eMSP, white-label, platform operator)
          - Macierz odpowiedzialności i przepływów danych między rolami
      - id: D00.04
        key: identifiers
        name: Identyfikatory i rejestry
        priority: mvp
        verify: true
        topics:
          - EVSE ID, Operator ID, Provider ID (formaty eMI3 / ISO 15118)
          - Contract ID / EMAID, PCID, VIN, RFID UID
          - OCPI country_code + party_id, rejestry ID krajowe i ich operatorzy
          - Unikalność, normalizacja i walidacja identyfikatorów w CPMS
      - id: D00.05
        key: ecosystem-map
        name: Mapa ekosystemu i organizacji standaryzacyjnych
        priority: mvp
        topics:
          - Open Charge Alliance, EVRoaming Foundation, CharIN, Hubject, Gireve, e-clearing.net
          - ISO, IEC, CEN-CENELEC, ETSI, SAE, OpenADR Alliance, EEBus Initiative, S.A.F.E.
          - Instytucje UE i krajowe (Komisja Europejska, regulatorzy energii, NAP)
          - Relacje między standardami — który dokument nadpisuje / odwołuje się do którego

  # ───────────────────────────── Protokoły ─────────────────────────────
  - id: D01
    key: protocols
    name: Protokoły i standardy komunikacji
    name_en: Communication protocols & standards
    description: Fundament techniczny — komunikacja EV↔EVSE, EVSE↔CSMS, CPO↔eMSP, system↔energia.
    priority: mvp
    skills: [ev-ocpp-expert, ev-ocpi-roaming-expert, ev-iso15118-pki-expert]
    depends_on: [D00]
    subdomains:
      - id: D01.01
        key: ocpp
        name: OCPP (EVSE ↔ CSMS)
        skills: [ev-ocpp-expert]
        priority: mvp
        verify: true
        topics:
          - Wersje 1.5, 1.6J (Edition 2), 2.0.1, 2.1 — różnice, erraty, niekompatybilność 1.6 ↔ 2.x
          - Status OCPP 2.0.1 jako normy IEC 63584
          - Architektura (WebSocket, JSON-RPC-like, SOAP w 1.5/1.6S), sub-protokoły, kolejkowanie
          - Profile/Functional Blocks (Core, Smart Charging, Firmware, Reservation, Local Auth List…)
          - Komunikaty — warunki użycia, odpowiedzi, timeouty, retry
          - Konfiguracja (Configuration Keys 1.6) vs Device Model (2.x: Components/Variables)
          - Cykl życia transakcji 1.6 vs 2.x (TransactionEvent), offline behavior, kolejka transakcji
          - Security profiles, certyfikaty, logi bezpieczeństwa
          - DataTransfer i rozszerzenia producentów
          - Zgodność i certyfikacja (OCTT, profile certyfikacyjne)
      - id: D01.02
        key: ocpi
        name: OCPI (CPO ↔ eMSP / hub)
        skills: [ev-ocpi-roaming-expert]
        priority: mvp
        verify: true
        topics:
          - Wersje 2.1.1, 2.2, 2.2.1, 2.3.0 oraz prace nad 3.0 — różnice i ścieżki migracji
          - Role (CPO, eMSP, Hub, NAP, NSP, SCSP) i moduły Credentials/Versions
          - Locations, EVSE, Connector — model i aktualizacje
          - Tariffs, Tokens, Sessions, CDRs, Commands, ChargingProfiles, HubClientInfo
          - Push vs pull, paginacja, routing przez hub, nagłówki OCPI-to/from
          - Signed data / signed meter values, korekty CDR (credit CDR)
          - Rozszerzenia (np. płatności ad hoc / DirectPayment) i rekomendacje branżowe
      - id: D01.03
        key: oicp
        name: OICP (Hubject)
        skills: [ev-ocpi-roaming-expert]
        priority: p2
        verify: true
        topics:
          - Wersje OICP, architektura CPO/EMP ↔ Hubject
          - EVSE Data/Status, Authorization, Charge Detail Records, Pricing, Plug & Charge
          - Różnice modelu danych OICP vs OCPI i mapowanie
      - id: D01.04
        key: emip
        name: eMIP (Gireve)
        skills: [ev-ocpi-roaming-expert]
        priority: p3
        verify: true
        topics:
          - Architektura i obiekty eMIP, różnice względem OCPI
          - Rola Gireve i współistnienie eMIP z OCPI
      - id: D01.05
        key: ochp
        name: OCHP i inne protokoły roamingowe
        skills: [ev-ocpi-roaming-expert]
        priority: p3
        verify: true
        topics:
          - OCHP / OCHPdirect (e-clearing.net) — status i zastosowanie
          - Protokoły historyczne i lokalne, migracje do OCPI
      - id: D01.06
        key: iso-15118
        name: ISO 15118 (EV ↔ EVSE, high-level communication)
        skills: [ev-iso15118-pki-expert]
        priority: p2
        verify: true
        topics:
          - Części -1, -2, -3, -8, -10, -20 i -20 vs -2 (BPT, WPT, dynamic mode)
          - Sekwencje komunikacji (SLAC, SDP, TLS, sesja V2G)
          - Plug & Charge — kontrakty, certyfikaty, rola backendu i OCPP
          - Integracja ISO 15118 z OCPP 2.x (certyfikaty, autoryzacja, profile ładowania)
      - id: D01.07
        key: din-70121
        name: DIN SPEC 70121
        skills: [ev-iso15118-pki-expert]
        priority: p2
        topics:
          - Zakres i ograniczenia względem ISO 15118-2
          - Autocharge (MAC jako identyfikator) — mechanizm, ryzyka
      - id: D01.08
        key: other-ev-evse
        name: Inne systemy komunikacji EV ↔ EVSE
        skills: []
        priority: p3
        verify: true
        topics:
          - CHAdeMO (wersje, CAN, V2X)
          - GB/T, ChaoJi
          - SAE J1772, SAE J3400 (NACS) i komunikacja
          - MCS — Megawatt Charging System (CharIN, SAE J3271, ISO/IEC)
      - id: D01.09
        key: energy-protocols
        name: Protokoły zarządzania energią
        skills: []
        priority: p2
        verify: true
        topics:
          - OSCP (Open Smart Charging Protocol)
          - OpenADR 2.0 / 3.0
          - IEEE 2030.5
          - EEBus (SHIP/SPINE) — integracja z HEMS
          - IEC 61850 w kontekście stacji i magazynów
      - id: D01.10
        key: field-protocols
        name: Komunikacja polowa i urządzeń
        skills: []
        priority: p2
        topics:
          - Modbus RTU/TCP — liczniki, falowniki, BESS, rejestry
          - SunSpec
          - MQTT — architektura, QoS, bezpieczeństwo, zastosowania w EMS/IoT
          - M-Bus / DLMS-COSEM w pomiarach
          - CAN w urządzeniach DC
      - id: D01.11
        key: emerging-standards
        name: Standardy w przygotowaniu
        skills: []
        priority: p3
        verify: true
        topics:
          - IEC 63110 (zarządzanie infrastrukturą ładowania)
          - IEC 63119 (wymiana informacji roamingowych)
          - Nowe wersje OCPP/OCPI/ISO — projekty, konsultacje, zapowiedzi

  # ───────────────────────── Elektrotechnika ─────────────────────────
  - id: D02
    key: electrical
    name: Normy elektrotechniczne i fizyka ładowania
    name_en: Electrical standards & charging physics
    description: Warstwa fizyczna — tryby ładowania, złącza, instalacja, ochrona, jakość energii.
    priority: p2
    skills: [ev-evse-hardware-expert]
    depends_on: [D00]
    subdomains:
      - id: D02.01
        key: iec-61851
        name: IEC 61851 — systemy ładowania przewodowego
        priority: p2
        verify: true
        topics:
          - Tryby ładowania 1–4, stany pilotowe A–F, sygnał CP i PP
          - Części -1, -21-x, -23, -24, -25 — zakres
          - Sygnalizacja PWM, ograniczenie prądu, wake-up
      - id: D02.02
        key: connectors
        name: Złącza i gniazda (IEC 62196 i inne)
        priority: p2
        topics:
          - Type 1, Type 2, CCS1, CCS2, CHAdeMO, GB/T, NACS, MCS
          - Kable przytwierdzone vs gniazda, blokady, chłodzenie kabli
          - Mapowanie typów złączy na wartości enum w OCPP/OCPI
      - id: D02.03
        key: installation
        name: Instalacja elektryczna i ochrona
        priority: p2
        verify: true
        topics:
          - IEC 60364-7-722 i wymagania krajowe
          - RCD typ A/B, detekcja DC 6 mA, zabezpieczenia nadprądowe, przepięciowe
          - Uziemienie, PEN fault detection, układy sieci TN/TT/IT
      - id: D02.04
        key: power-electronics
        name: Podstawy energoelektroniki i ładowania DC
        priority: p3
        topics:
          - AC vs DC, prostowniki, moduły mocy, sprawność
          - Architektury 400 V / 800 V, napięcia i prądy graniczne
          - Chłodzenie, derating termiczny
      - id: D02.05
        key: power-quality
        name: Jakość energii i EMC
        priority: p3
        topics:
          - Współczynnik mocy, THD, harmoniczne, asymetria faz
          - Wymagania EMC i stopnie ochrony IP/IK

  # ───────────────────────────── Hardware ─────────────────────────────
  - id: D03
    key: hardware
    name: Urządzenia, komponenty i producenci
    name_en: Hardware, components & manufacturers
    description: Karty techniczne urządzeń, możliwości OCPP, firmware, diagnostyka sprzętowa.
    priority: mvp
    skills: [ev-evse-hardware-expert, ev-evse-diagnostics-expert, ev-charging-operations-expert]
    depends_on: [D00, D01, D02]
    subdomains:
      - id: D03.01
        key: device-categories
        name: Kategorie urządzeń
        skills: [ev-evse-hardware-expert]
        priority: mvp
        topics:
          - AC wallbox, AC słupek, DC kompakt, DC fast, HPC
          - Ładowarki modułowe, systemy satelitarne (power cabinet + dispensers)
          - Ładowarki z magazynem energii, mobilne
      - id: D03.02
        key: components
        name: Komponenty
        skills: [ev-evse-hardware-expert]
        priority: p2
        topics:
          - Kontrolery komunikacyjne i ładowania, modemy LTE/Ethernet/Wi-Fi
          - Liczniki energii (AC/DC, MID, Eichrecht), czytniki RFID, wyświetlacze
          - Terminale płatnicze, moduły mocy, styczniki, chłodzenie, zabezpieczenia
      - id: D03.03
        key: device-cards
        name: Karty techniczne urządzeń
        skills: [ev-evse-hardware-expert]
        priority: mvp
        topics:
          - Szablon karty (identyfikacja, moc, złącza, komunikacja, OCPP, parametry, ograniczenia, diagnostyka, firmware)
          - Karty rodzin urządzeń wiodących producentów
          - Deklarowane vs zweryfikowane funkcje OCPP (capability matrix)
          - Opis złączy i możliwości punktu w danych protokołów (OCPP ConnectorEnumType, OCPI ConnectorType i capabilities)
      - id: D03.04
        key: manufacturers
        name: Producenci
        skills: [ev-evse-hardware-expert]
        priority: p2
        topics:
          - Profile producentów, portfolio, rynki, kanały wsparcia
          - Dokumentacja i portale serwisowe, polityka aktualizacji
      - id: D03.05
        key: firmware
        name: Firmware i cykl życia oprogramowania urządzeń
        skills: [ev-evse-diagnostics-expert]
        priority: mvp
        topics:
          - Wersjonowanie, release notes, kompatybilność z CPMS
          - Procedury aktualizacji zdalnej i rollbacku
          - Znane problemy wersji (link do D21)
      - id: D03.06
        key: hardware-diagnostics
        name: Kody błędów i diagnostyka sprzętowa
        skills: [ev-charging-operations-expert]
        priority: mvp
        topics:
          - Kody błędów OCPP (ErrorCode, vendorErrorCode) vs kody producentów
          - Logi, alarmy, zdarzenia Device Model
          - Mapowanie kodów na przyczyny i działania
      - id: D03.07
        key: procurement
        name: Wybór, zakup i TCO urządzeń
        skills: [ev-evse-hardware-expert]
        priority: p3
        topics:
          - Kryteria wyboru, wymagania przetargowe, gwarancje, SLA producenta
          - TCO, koszty serwisu, dostępność części

  # ─────────────────────────────── EV ───────────────────────────────
  - id: D04
    key: vehicle
    name: Pojazd, bateria i interakcja EV–EVSE
    name_en: Vehicle, battery & EV–EVSE interaction
    description: Perspektywa pojazdu — co wpływa na przebieg sesji i kompatybilność.
    priority: p2
    skills: [ev-evse-diagnostics-expert]
    depends_on: [D01, D02]
    subdomains:
      - id: D04.01
        key: battery-bms
        name: Bateria i BMS
        priority: p2
        topics:
          - Chemie ogniw, architektura pakietu, rola BMS
          - SOC, SOH, limity temperaturowe, degradacja
      - id: D04.02
        key: charging-curves
        name: Krzywe ładowania i preconditioning
        priority: p2
        topics:
          - Krzywe mocy według modeli, wpływ temperatury i SOC
          - Preconditioning, nawigacja do ładowarki
          - Interpretacja „niskiej mocy” w zgłoszeniach klientów
      - id: D04.03
        key: compatibility
        name: Kompatybilność pojazd–ładowarka
        priority: p2
        topics:
          - Znane problemy kompatybilności (handshake, izolacja, timeouty)
          - Testy interoperacyjności, macierze kompatybilności
      - id: D04.04
        key: vehicle-identification
        name: Identyfikacja pojazdu i autoryzacja
        priority: p2
        topics:
          - Plug & Charge vs Autocharge vs RFID vs aplikacja
          - Dane z pojazdu dostępne dla EVSE/CSMS (SOC, departure time, energia)
      - id: D04.05
        key: oem-telematics
        name: Telematyka i API producentów pojazdów
        priority: p3
        topics:
          - API OEM (SOC, lokalizacja, harmonogramy), agregatory danych pojazdów
          - Zastosowania w smart charging i flotach

  # ─────────────────────────────── CPMS ───────────────────────────────
  - id: D05
    key: cpms
    name: CPMS / CSMS i systemy zarządzania
    name_en: CPMS / CSMS & management systems
    description: Funkcje, moduły i wzorce architektoniczne systemów zarządzania ładowaniem.
    priority: mvp
    skills: [ev-cpms-architect, ev-integration-architect, ev-product-designer]
    depends_on: [D00, D01, D03]
    subdomains:
      - id: D05.01
        key: architecture
        name: Architektura CPMS
        skills: [ev-cpms-architect]
        priority: mvp
        topics:
          - Moduły referencyjne i granice odpowiedzialności
          - Warstwa komunikacji OCPP (connection management, skalowanie WebSocket)
          - Multi-tenancy, white-label, hierarchia organizacji
      - id: D05.02
        key: asset-management
        name: Zarządzanie flotą urządzeń
        skills: [ev-cpms-architect]
        priority: mvp
        topics:
          - Provisioning i onboarding ładowarek
          - Zarządzanie konfiguracją i firmware w skali
          - Inwentaryzacja, hierarchia lokalizacji, dane statyczne
      - id: D05.03
        key: session-management
        name: Sesje, transakcje i autoryzacja
        skills: [ev-cpms-architect]
        priority: mvp
        topics:
          - Maszyna stanów sesji (w tym przypadki brzegowe i odzyskiwanie)
          - Remote start/stop, rezerwacje, lokalna lista autoryzacji, cache
          - Obsługa transakcji offline i opóźnionych
      - id: D05.04
        key: status-availability
        name: Statusy i dostępność
        skills: [ev-cpms-architect]
        priority: mvp
        topics:
          - Model statusów (połączenie, EVSE, connector) i ich agregacja
          - Offline vs unavailable vs faulted — reguły rozróżniania
          - Wyliczanie dostępności (uptime) zgodnie z definicjami regulacyjnymi
      - id: D05.05
        key: external-assets
        name: Ładowarki własne vs roamingowe / zewnętrzne
        skills: [ev-cpms-architect]
        priority: mvp
        topics:
          - Zakres operacji dla urządzeń OCPP vs danych OCPI
          - Synchronizacja statusów, lokalizacji, taryf, sesji; konflikty danych
          - Wykrywanie braku aktualizacji danych zewnętrznych
      - id: D05.06
        key: users-permissions
        name: Użytkownicy, role i uprawnienia
        skills: [ev-cpms-architect]
        priority: p2
        topics:
          - RBAC/ABAC dla CPO, site hostów, serwisu, klientów flotowych
          - Audyt działań operatorów
      - id: D05.07
        key: cpms-apis
        name: API i integracje CPMS
        skills: [ev-integration-architect]
        priority: p2
        topics:
          - API publiczne i partnerskie, webhooks, eventy
          - Integracje ERP, CRM, ticketing, BI, płatności
      - id: D05.08
        key: emsp-platform
        name: Platforma eMSP
        skills: [ev-product-designer]
        priority: p2
        topics:
          - Zarządzanie kontraktami i tokenami, aplikacja kierowcy
          - Agregacja lokalizacji, ceny dla kierowcy, rozliczenia z CPO
      - id: D05.09
