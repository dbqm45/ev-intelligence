# Rejestr źródeł NIEDOSTĘPNYCH: normy i dokumenty, które przywołują nasze źródła albo skille, ale których treści
# nie mamy (płatne, niezarejestrowane, zablokowany host). Decyzja właściciela projektu z 2026-11-07.
#
# Zasady:
# - Wpis NIE jest źródłem. Celowo nie ma pola `id`, więc tools/ev_kb.py nie traktuje go jako dokumentu do cytowania.
#   Znacznik [ISO 15118-2 §…] w skillu będzie błędem `check` (NIEZNANY_DOKUMENT).
# - O treści takiej normy nie piszemy z pamięci. Wolno podać numer i kontekst, w jakim przywołuje ją dokument
#   z `sources/*.yaml` (pole `przywolana_przez`).
# - `dostep`:
#   - `platna`: norma wydawana odpłatnie; brak kopii (płatność potwierdza dopiero zakup u wydawcy);
#   - `niezarejestrowana`: dokument prawdopodobnie bezpłatny, ale jeszcze niepobrany i niesprawdzony;
#   - `zablokowany`: host niedostępny z sieci sesji;
#   - `licencja_poufna`: dokument dostępny, ale licencja zakazuje ujawniania treści (np. eMIP); nie opracowujemy go.
# - `klucze` (opcjonalne): dodatkowe słowa do dopasowania pytań, gdy nazwa nie ma numeru normy (np. „emip”).
# - Gdy uzyskamy dokument: pobranie → wpis w `sources/<wydawca>.yaml` z SHA-256 → usunięcie wpisu stąd.
# - `przywolana_w`: skille, które wymieniają dokument (stan 2026-11-07). Aktualizuj przy zmianach.

updated: 2026-11-07

